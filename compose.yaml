services:
  smp4_front:
    image: ${FRONT_IMAGE}
    restart: always
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=${BACK_URL}
  smp4_back:
    image: ${BACK_IMAGE}
    restart: always
    ports:
      - "8443:8888"
    environment:
      - DATABASE_URL=postgres://${PG_USER}:${PG_PWD}@smp4_database:5432/${PG_DB}
      - JWT_SECRET=${JWT_SECRET}
      - HASH_SECRET=${HASH_SECRET}
      - EXPOSE_IP=0.0.0.0
      - EXPOSE_PORT=8888
      - RUST_LOG=info
  smp4_database:
    image: "postgres:16.11"
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - /projects/smp4-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${PG_PWD}
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_DB=${PG_DB}

  